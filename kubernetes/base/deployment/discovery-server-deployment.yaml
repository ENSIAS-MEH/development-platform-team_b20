apiVersion: apps/v1
kind: Deployment
metadata:
  name: discovery-server
  namespace: smartevent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: discovery-server
  template:
    metadata:
      labels:
        app: discovery-server
    spec:
      containers:
      - name: discovery-server
        image: development-platform-team_b20-discovery-server:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8761
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "512Mi"
            cpu: "400m"
