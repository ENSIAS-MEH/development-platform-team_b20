apiVersion: apps/v1
kind: Deployment
metadata:
  name: event-service
  namespace: smartevent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: event-service
  template:
    metadata:
      labels:
        app: event-service
    spec:
      containers:
      - name: event-service
        image: event-service:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8082
        env:
        - name: SPRING_DATASOURCE_URL
          value: "jdbc:postgresql://aws-0-eu-west-1.pooler.supabase.com:6543/postgres?sslmode=require&currentSchema=events_schema"
        - name: SPRING_DATASOURCE_USERNAME
          value: "postgres.clngjxlkalfnmwnggnxz"
        - name: SPRING_DATASOURCE_PASSWORD
          value: "hatimBH12345@"
        - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
          value: "http://discovery-server:8761/eureka/"
        - name: SPRING_JPA_DATABASE_PLATFORM
          value: "org.hibernate.dialect.PostgreSQLDialect"
        - name: EUREKA_INSTANCE_HOSTNAME
          value: "event-service"
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"