spring.application.name=api-gateway

server.port=8080

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Explicit routes
spring.cloud.gateway.server.webmvc.routes[0].id=interaction-service
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://INTERACTION-SERVICE
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/interaction-service/**
spring.cloud.gateway.server.webmvc.routes[0].filters[0]=StripPrefix=1

spring.cloud.gateway.server.webmvc.routes[1].id=event-service
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://EVENT-SERVICE
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/event-service/**
spring.cloud.gateway.server.webmvc.routes[1].filters[0]=StripPrefix=1

spring.cloud.gateway.server.webmvc.routes[2].id=user-service
spring.cloud.gateway.server.webmvc.routes[2].uri=lb://USER-SERVICE
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/user-service/**
spring.cloud.gateway.server.webmvc.routes[2].filters[0]=StripPrefix=1

spring.cloud.gateway.server.webmvc.routes[3].id=admin-service
spring.cloud.gateway.server.webmvc.routes[3].uri=lb://ADMIN-SERVICE
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/admin-service/**
spring.cloud.gateway.server.webmvc.routes[3].filters[0]=StripPrefix=1


spring.cloud.gateway.server.webmvc.routes[4].id=recommendation-service
spring.cloud.gateway.server.webmvc.routes[4].uri=lb://recommendation-service
spring.cloud.gateway.server.webmvc.routes[4].predicates[0]=Path=/recommendation-service/**
spring.cloud.gateway.server.webmvc.routes[4].filters[0]=StripPrefix=1
