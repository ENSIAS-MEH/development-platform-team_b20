server {
    listen 80;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location /user-service/ {
        proxy_pass http://api-gateway:8080/user-service/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /event-service/ {
        proxy_pass http://api-gateway:8080/event-service/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /interaction-service/ {
        proxy_pass http://api-gateway:8080/interaction-service/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /admin-service/ {
        proxy_pass http://api-gateway:8080/admin-service/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /recommendation-service/ {
        proxy_pass http://api-gateway:8080/recommendation-service/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}